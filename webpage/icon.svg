<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Plate -->
  <ellipse cx="50" cy="55" rx="45" ry="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="3"/>
  
  <!-- Pommes (Fries) -->
  <g stroke="#e6a817" stroke-width="1">
    <rect x="25" y="30" width="6" height="25" rx="2" fill="#ffc107" transform="rotate(-20 25 30)"/>
    <rect x="35" y="25" width="7" height="30" rx="2" fill="#ffca28" transform="rotate(-5 35 25)"/>
    <rect x="45" y="27" width="6" height="28" rx="2" fill="#ffb300" transform="rotate(10 45 27)"/>
    <rect x="55" y="32" width="7" height="25" rx="2" fill="#ffca28" transform="rotate(25 55 32)"/>
    <rect x="30" y="35" width="6" height="22" rx="2" fill="#ffb300" transform="rotate(-40 30 35)"/>
    <rect x="65" y="40" width="6" height="20" rx="2" fill="#ffc107" transform="rotate(45 65 40)"/>
  </g>

  <!-- Schnitzel -->
  <path d="M 25 60 Q 20 45 40 48 Q 55 45 70 50 Q 85 55 80 70 Q 75 85 50 82 Q 25 80 25 60 Z" fill="#e08e36" stroke="#b86b1c" stroke-width="2"/>
  
  <!-- Breading Texture -->
  <g fill="#c97620">
    <circle cx="35" cy="55" r="1.5"/>
    <circle cx="45" cy="52" r="1"/>
    <circle cx="60" cy="56" r="2"/>
    <circle cx="70" cy="62" r="1.5"/>
    <circle cx="50" cy="65" r="1"/>
    <circle cx="40" cy="70" r="1.5"/>
    <circle cx="65" cy="72" r="1"/>
    <circle cx="30" cy="65" r="1"/>
    <circle cx="55" cy="75" r="1.5"/>
  </g>

  <!-- Lemon slice -->
  <path d="M 75 45 A 12 12 0 0 1 87 57 L 75 57 Z" fill="#ffee58" stroke="#fbc02d" stroke-width="1.5" transform="rotate(-15 75 45)"/>
</svg>
