<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schnitzel Auswertung</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <style>
        body {
            font-family: Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        .chart-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 30px;
            position: relative;
            height: 400px;
        }
        .nav-link {
            display: block;
            text-align: center;
            margin-bottom: 30px;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Schnitzel Auswertung</h1>
    <a href="index.html" class="nav-link">← Zurück zur Startseite</a>

    <div class="chart-container">
        <canvas id="overallPieChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="yearlyBarChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="monthlyLineChart"></canvas>
    </div>

    <div class="chart-container">
        <canvas id="weekdayBarChart"></canvas>
    </div>

    <script>
        // Configuration for colors
        const colorJa = 'rgba(75, 192, 192, 0.7)';
        const colorNein = 'rgba(255, 99, 132, 0.7)';
        const colorJaBorder = 'rgb(75, 192, 192)';
        const colorNeinBorder = 'rgb(255, 99, 132)';

        async function fetchAndParseData() {
            try {
                const response = await fetch('stats.txt'); 
                if (!response.ok) throw new Error("Stats file not found");
                const text = await response.text();
                
                const lines = text.split('\n');
                const data = [];

                lines.forEach(line => {
                    line = line.trim();
                    if (!line || !line.includes('_')) return;

                    const [datePart, answer] = line.split('_');
                    
                    let parsedDate;
                    if (datePart.includes('/')) {
                        const parts = datePart.split('/');
                        parsedDate = new Date(2000 + parseInt(parts[2]), parseInt(parts[0]) - 1, parseInt(parts[1]));
                    } else if (datePart.includes('.')) {
                        const parts = datePart.split('.');
                        parsedDate = new Date(parts[2], parseInt(parts[1]) - 1, parseInt(parts[0]));
                    } else if (datePart.includes('-')) {
                         parsedDate = new Date(datePart);
                    }

                    if (parsedDate && !isNaN(parsedDate)) {
                        data.push({
                            date: parsedDate,
                            year: parsedDate.getFullYear(),
                            month: `${parsedDate.getFullYear()}-${String(parsedDate.getMonth() + 1).padStart(2, '0')}`,
                            dayOfWeek: parsedDate.getDay(),
                            answer: answer.toLowerCase()
                        });
                    }
                });

                renderCharts(data);

            } catch (error) {
                console.error("Error loading data:", error);
                document.body.innerHTML += `<p style="text-align:center; color:red;">Fehler beim Laden der stats.txt: ${error.message}.</p>`;
            }
        }

        function renderCharts(data) {
            if (data.length === 0) return;

            let totalJa = 0;
            let totalNein = 0;
            const yearlyStats = {};
            const monthlyStats = {};
            
            const currentYear = new Date().getFullYear();
            const weekdayStatsThisYear = { 1: { total: 0, ja: 0 }, 2: { total: 0, ja: 0 }, 3: { total: 0, ja: 0 }, 4: { total: 0, ja: 0 }, 5: { total: 0, ja: 0 } };
            const weekdayStatsPastYears = { 1: { total: 0, ja: 0 }, 2: { total: 0, ja: 0 }, 3: { total: 0, ja: 0 }, 4: { total: 0, ja: 0 }, 5: { total: 0, ja: 0 } };
            const weekdayNames = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];

            data.forEach(entry => {
                const isJa = entry.answer === 'ja';
                
                if (isJa) totalJa++;
                else totalNein++;

                if (!yearlyStats[entry.year]) yearlyStats[entry.year] = { ja: 0, nein: 0 };
                if (isJa) yearlyStats[entry.year].ja++;
                else yearlyStats[entry.year].nein++;

                if (!monthlyStats[entry.month]) monthlyStats[entry.month] = { ja: 0, total: 0 };
                monthlyStats[entry.month].total++;
                if (isJa) monthlyStats[entry.month].ja++;

                if (entry.dayOfWeek >= 1 && entry.dayOfWeek <= 5) {
                    if (entry.year === currentYear) {
                        weekdayStatsThisYear[entry.dayOfWeek].total++;
                        if (isJa) weekdayStatsThisYear[entry.dayOfWeek].ja++;
                    } else {
                        weekdayStatsPastYears[entry.dayOfWeek].total++;
                        if (isJa) weekdayStatsPastYears[entry.dayOfWeek].ja++;
                    }
                }
            });

            // --- 1. Overall Pie Chart ---
            new Chart(document.getElementById('overallPieChart'), {
                type: 'pie',
                data: {
                    labels: ['Ja', 'Nein'],
                    datasets: [{
                        data: [totalJa, totalNein],
                        backgroundColor: [colorJa, colorNein],
                        borderColor: [colorJaBorder, colorNeinBorder],
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { title: { display: true, text: `Gesamtverteilung (${totalJa + totalNein} Tage)`, font: { size: 18 } } } }
            });

            // --- 2. Yearly Bar Chart ---
            const years = Object.keys(yearlyStats).sort();
            new Chart(document.getElementById('yearlyBarChart'), {
                type: 'bar',
                data: {
                    labels: years,
                    datasets: [
                        { label: 'Ja', data: years.map(y => yearlyStats[y].ja), backgroundColor: colorJa, borderWidth: 1 },
                        { label: 'Nein', data: years.map(y => yearlyStats[y].nein), backgroundColor: colorNein, borderWidth: 1 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }, plugins: { title: { display: true, text: 'Schnitzel nach Jahr', font: { size: 18 } } } }
            });

            // --- 3. Monthly Line Chart ---
            const months = Object.keys(monthlyStats).sort();
            new Chart(document.getElementById('monthlyLineChart'), {
                type: 'line',
                data: {
                    labels: months,
                    datasets: [{
                        label: '% Wahrscheinlichkeit für Schnitzel',
                        data: months.map(m => (monthlyStats[m].ja / monthlyStats[m].total) * 100),
                        borderColor: '#36A2EB', backgroundColor: 'rgba(54, 162, 235, 0.2)', fill: true, tension: 0.3, pointRadius: 4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } } }, plugins: { title: { display: true, text: 'Monatliche Schnitzel-Wahrscheinlichkeit', font: { size: 18 } } } }
            });

            // --- 4. Tops & Flops Grouped Bar Chart (With DataLabels) ---
            const thisYearPercentages = [];
            const pastYearsPercentages = [];

            for (let i = 1; i <= 5; i++) {
                const statsThis = weekdayStatsThisYear[i];
                const statsPast = weekdayStatsPastYears[i];
                thisYearPercentages.push(statsThis.total > 0 ? (statsThis.ja / statsThis.total) * 100 : 0);
                pastYearsPercentages.push(statsPast.total > 0 ? (statsPast.ja / statsPast.total) * 100 : 0);
            }

            function getColors(percentages) {
                const validPercentages = percentages.filter(p => p > 0);
                if (validPercentages.length === 0) return percentages.map(() => 'rgba(201, 203, 207, 0.2)');

                const max = Math.max(...validPercentages);
                const min = Math.min(...validPercentages);

                return percentages.map(p => {
                    if (p === 0) return 'rgba(201, 203, 207, 0.2)';
                    if (p === max) return 'rgba(75, 192, 192, 0.9)'; // Green (Top)
                    if (p === min) return 'rgba(255, 99, 132, 0.9)'; // Red (Flop)
                    return 'rgba(201, 203, 207, 0.4)'; // Neutral (Light Grey)
                });
            }

            new Chart(document.getElementById('weekdayBarChart'), {
                type: 'bar',
                plugins: [ChartDataLabels], // Inject the datalabels plugin only for this chart
                data: {
                    labels: weekdayNames,
                    datasets: [
                        {
                            label: `Dieses Jahr (${currentYear})`,
                            data: thisYearPercentages,
                            backgroundColor: getColors(thisYearPercentages),
                            borderWidth: 1,
                            borderColor: 'rgba(0,0,0,0.1)'
                        },
                        {
                            label: 'Letzte Jahre (Ø)',
                            data: pastYearsPercentages,
                            backgroundColor: getColors(pastYearsPercentages),
                            borderWidth: 1,
                            borderColor: 'rgba(0,0,0,0.1)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + "%" } }
                    },
                    plugins: {
                        title: { display: true, text: 'Wochentage Tops & Flops (% Schnitzel-Chance)', font: { size: 18 } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + '% Chance';
                                }
                            }
                        },
                        // Configure the DataLabels here
                        datalabels: {
                            color: '#333', 
                            anchor: 'start', // Start at the bottom of the bar
                            align: 'top',    // Push text upwards so it sits just above the 0 line inside the bar
                            offset: 4,
                            font: {
                                weight: 'bold',
                                size: 11
                            },
                            formatter: function(value, context) {
                                // Don't show a label if the bar has 0% data
                                if (value === 0) return '';
                                // Return the Year for the first dataset, and "Ø" for the second dataset
                                return context.datasetIndex === 0 ? String(currentYear) : 'Ø vor 2026';
                            }
                        }
                    }
                }
            });
        }

        window.onload = fetchAndParseData;
    </script>
</body>
</html>
